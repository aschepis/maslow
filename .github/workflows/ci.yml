name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The browser tests fail instead of skipping when Chrome is missing (task 42).
    env:
      MASLOW_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pull request code in maslow-evidence.yml can write main's cache scope, so nothing restores it.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Install CUE
        run: go install cuelang.org/go/cmd/cue@v0.15.4

      - name: Install zizmor
        run: pipx install zizmor==1.32.0

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Check embedded schema matches schema/maslow.cue
        run: diff -u schema/maslow.cue internal/schema/maslow.cue

      # Uses the runner image's preinstalled Chrome; no setup action, so nothing to pin.
      - name: Show Chrome version
        run: google-chrome --version

      - name: Test
        run: make test

      # make test hides passes; this puts the browser tests' --- PASS lines in the log.
      - name: Browser tests (verbose)
        run: go test -v -run Browser ./internal/runner/

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      # Dogfood the Action: on pull requests, judge the change against its base
      # using the base branch's spec, exactly as an adopting project would.
      - name: Verify (full profile)
        id: maslow
        uses: ./action
        with:
          binary: bin/maslow
          profile: full
          base: ${{ github.event.pull_request.base.sha }}
          spec-from: ${{ github.event_name == 'pull_request' && 'base' || 'head' }}

      - name: Release build smoke test
        run: scripts/build-release.sh "v0.0.0-ci"
