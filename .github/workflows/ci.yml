name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install CUE
        run: go install cuelang.org/go/cmd/cue@v0.15.4

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Check embedded schema matches schema/maslow.cue
        run: diff -u schema/maslow.cue internal/schema/maslow.cue

      - name: Test
        run: make test

      - name: Lint
        run: make lint

      - name: Verify (full profile)
        run: make verify

      - name: Release build smoke test
        run: scripts/build-release.sh "v0.0.0-ci"

      - name: Upload verify report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: reports/verify.json
          if-no-files-found: ignore
