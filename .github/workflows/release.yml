name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install CUE
        run: go install cuelang.org/go/cmd/cue@v0.15.4

      - name: Test before publishing
        run: |
          make test
          make lint
          make verify

      - name: Build archives and checksums
        run: scripts/build-release.sh "${GITHUB_REF_NAME}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/checksums.txt --verify-tag --generate-notes
