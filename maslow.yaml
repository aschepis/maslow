mas: "1.0"
project:
  name: maslow
  description: Executable specification system for agent-built software
  version: "0.1.0"
  license: MIT
  repository: https://github.com/aschepis/maslow

toolchain:
  manager: asdf
  tools:
    - name: go
      version: "1.25"
      required: true
    - name: cue
      version: "0.15"
      required: true
  lockfiles:
    - go.sum

refs:
  - kind: file
    path: go.mod
    description: Go module definition
  - kind: file
    path: schema/maslow.cue
    description: CUE schema for MAS validation
  - kind: file
    path: maslow.yaml
    description: Self-hosting MAS spec
  - kind: file
    path: schema/evidence.schema.json
    description: JSON Schema for the evidence file (format version 2)
  - kind: file
    path: README.md
    description: Project README with install, usage, and development instructions
  - kind: file
    path: Makefile
    description: Development workflow targets (build, test, vet, lint, validate, verify, clean)
  - kind: file
    path: .github/workflows/ci.yml
    description: GitHub Actions CI running hygiene checks and maslow verify --profile full
  - kind: file
    path: .github/workflows/release.yml
    description: Tag-triggered release that publishes binaries and checksums
  - kind: file
    path: .github/workflows/maslow-evidence.yml
    description: pull_request_target workflow that produces trusted evidence for same-repository pull requests
  - kind: file
    path: scripts/check-trusted-workflow.sh
    description: Fails when the trusted evidence workflow gives the change's code write scope, secrets, a persisted token or a cache
  - kind: file
    path: zizmor.yml
    description: zizmor configuration with recorded suppressions
  - kind: file
    path: action/action.yml
    description: Composite GitHub Action that installs a pinned release and runs maslow verify
  - kind: file
    path: scripts/check-action-pins.sh
    description: Fails when action/action.yml, or a workflow using a third-party action, pins by anything but a commit SHA
  - kind: file
    path: scripts/build-release.sh
    description: Builds release archives for linux and darwin on amd64 and arm64, plus checksums.txt
  - kind: binary
    path: bin/maslow
    description: Built Maslow binary
    required: false

policy:
  deny:
    - "vendor/**"
    - "**/.env"
    - "**/credentials*"
  protected:
    - docs/REQUIREMENTS.md
  gated:
    - path: maslow.yaml
      owner: "@aschepis"
    - path: schema/**
      owner: "@aschepis"
    - path: internal/schema/maslow.cue
      owner: "@aschepis"
    - path: README.md
      owner: "@aschepis"
    - path: .github/workflows/**
      owner: "@aschepis"
    - path: zizmor.yml
      owner: "@aschepis"
  observe:
    test_integrity: {}

checks:
  runner:
    - name: go-build
      kind: command
      run: "go build -o bin/maslow ./cmd/maslow/"
      timeout: 120s
      tags:
        - build
    - name: go-test
      kind: command
      run: "go test ./..."
      timeout: 300s
      tags:
        - test
    - name: go-vet
      kind: command
      run: "go vet ./..."
      timeout: 60s
      tags:
        - lint
    - name: cue-vet
      kind: command
      run: "cue vet schema/maslow.cue"
      timeout: 30s
      tags:
        - lint
    - name: self-validate
      kind: command
      run: "go run ./cmd/maslow/ validate maslow.yaml"
      timeout: 30s
      tags:
        - self-host
    - name: action-pins
      kind: script
      run: "scripts/check-action-pins.sh --workflows .github/workflows action/action.yml"
      timeout: 10s
      tags:
        - lint
    - name: trusted-workflow
      kind: script
      run: "scripts/check-trusted-workflow.sh .github/workflows/maslow-evidence.yml"
      timeout: 10s
      tags:
        - lint
    # CI installs zizmor 1.32.0 with pipx; the quick profile leaves it out so it runs without zizmor.
    - name: zizmor
      kind: command
      run: "zizmor --offline --config zizmor.yml .github/workflows action/action.yml"
      timeout: 60s
      tags:
        - lint

profiles:
  quick:
    description: Fast checks for development
    checks:
      - go-build
      - go-vet
      - cue-vet
      - self-validate
      - action-pins
      - trusted-workflow
    contracts:
      - smoke
    budgets: []
  full:
    description: All checks including tests
    checks:
      - go-build
      - go-test
      - go-vet
      - cue-vet
      - self-validate
      - action-pins
      - trusted-workflow
      - zizmor

contracts:
  - name: validate-command
    description: The validate command correctly validates MAS files
    tags:
      - smoke
    scenarios:
      - name: valid-file-passes
        steps:
          - action: cli
            command: bin/maslow
            args:
              - validate
              - testdata/valid/minimal.yaml
          - action: assert
            expect:
              exit_code: 0
              body_contains: "is valid"
      - name: policy-observe-block-is-valid
        steps:
          - action: cli
            command: bin/maslow
            args:
              - validate
              - testdata/valid/policy_observe.yaml
          - action: assert
            expect:
              exit_code: 0
              body_contains: "is valid"
      - name: policy-line-rules-are-valid
        steps:
          - action: cli
            command: bin/maslow
            args:
              - validate
              - testdata/valid/policy_test_integrity.yaml
          - action: assert
            expect:
              exit_code: 0
              body_contains: "is valid"
      - name: custom-test-language-needs-files
        steps:
          - action: cli
            command: bin/maslow
            args:
              - validate
              - testdata/invalid/policy_test_integrity_custom_without_files.yaml
          - action: assert
            expect:
              exit_code: 1
              body_contains: "languages.elixir.files: field is required"
      - name: invalid-file-fails
        steps:
          - action: cli
            command: bin/maslow
            args:
              - validate
              - testdata/invalid/missing_project.yaml
          - action: assert
            expect:
              exit_code: 1
      - name: retries-are-valid
        steps:
          - action: cli
            command: bin/maslow
            args:
              - validate
              - testdata/valid/retries.yaml
          - action: assert
            expect:
              exit_code: 0
              body_contains: "is valid"
      - name: retries-above-max-retries-fail
        steps:
          - action: cli
            command: bin/maslow
            args:
              - validate
              - testdata/invalid/retries_above_max_retries.yaml
          - action: assert
            expect:
              exit_code: 1
              body_contains: "retries: invalid value 2 (out of bound <=1)"
      - name: missing-argument
        steps:
          - action: cli
            command: bin/maslow
            args:
              - validate
          - action: assert
            expect:
              exit_code: 2

  - name: version-command
    description: The version command outputs version info
    scenarios:
      - name: prints-version
        steps:
          - action: cli
            command: bin/maslow
            args:
              - version
          - action: assert
            expect:
              exit_code: 0
              body_contains: "maslow"

  - name: help-command
    description: The help command displays usage information
    scenarios:
      - name: help-subcommand
        steps:
          - action: cli
            command: bin/maslow
            args:
              - help
          - action: assert
            expect:
              exit_code: 0
              body_contains: "Usage:"
      - name: help-flag
        steps:
          - action: cli
            command: bin/maslow
            args:
              - --help
          - action: assert
            expect:
              exit_code: 0
              body_contains: "Usage:"

  - name: usage-errors
    description: Invalid usage produces exit code 2
    tags:
      - smoke
    scenarios:
      - name: unknown-command
        steps:
          - action: cli
            command: bin/maslow
            args:
              - nonexistent
          - action: assert
            expect:
              exit_code: 2
      - name: no-arguments
        steps:
          - action: cli
            command: bin/maslow
          - action: assert
            expect:
              exit_code: 2

      - name: unknown-profile
        steps:
          - action: cli
            command: bin/maslow
            args:
              - verify
              - --profile
              - no-such-profile
          - action: assert
            expect:
              exit_code: 2
              body_contains: "not found"
      - name: base-requires-ref
        steps:
          - action: cli
            command: bin/maslow
            args:
              - verify
              - --base
          - action: assert
            expect:
              exit_code: 2
      - name: spec-from-base-requires-base
        steps:
          - action: cli
            command: bin/maslow
            args:
              - verify
              - --spec-from
              - base
          - action: assert
            expect:
              exit_code: 2
              body_contains: "requires --base"
      - name: removed-scaffold-command
        steps:
          - action: cli
            command: bin/maslow
            args:
              - scaffold
          - action: assert
            expect:
              exit_code: 2
      - name: removed-harness-command
        steps:
          - action: cli
            command: bin/maslow
            args:
              - harness
          - action: assert
            expect:
              exit_code: 2

  - name: verify-overlay
    description: Overlays may add contracts but never change or shadow the spec
    tags:
      - smoke
    scenarios:
      - name: rejects-non-contract-keys
        steps:
          - action: cli
            command: bin/maslow
            args:
              - verify
              - --profile
              - quick
              - --overlay
              - testdata/overlays/changes-policy.yaml
          - action: assert
            expect:
              exit_code: 1
              body_contains: "only description and contracts"
      - name: rejects-shadowing-a-spec-contract
        steps:
          - action: cli
            command: bin/maslow
            args:
              - verify
              - --profile
              - quick
              - --overlay
              - testdata/overlays/shadows-spec.yaml
          - action: assert
            expect:
              exit_code: 1
              body_contains: "already defined by the spec"
      - name: red-green-requires-base
        steps:
          - action: cli
            command: bin/maslow
            args:
              - verify
              - --red-green
              - --overlay
              - testdata/overlays/changes-policy.yaml
          - action: assert
            expect:
              exit_code: 2
              body_contains: "--red-green requires --base"

  - name: verify-retries
    description: A check that fails and then passes on a retry is flaky, keeps every attempt, and still passes
    tags:
      - smoke
    scenarios:
      - name: flaky-check-passes-with-attempts
        setup:
          - action: cli
            command: rm
            args:
              - -f
              - reports/flaky-marker
        steps:
          - action: cli
            command: bin/maslow
            args:
              - verify
              - --spec
              - testdata/flaky/maslow.yaml
              - --profile
              - quick
              - --report
              - reports/flaky-evidence.json
          - action: assert
            expect:
              exit_code: 0
              body_contains: "[flaky] fail-once"
          - action: cli
            command: cat
            args:
              - reports/flaky-evidence.json
          - action: assert
            expect:
              body_contains: '"status": "flaky"'
          - action: assert
            expect:
              body_contains: '"attempts": ['
          - action: cli
            command: bin/maslow
            args:
              - evidence
              - summary
              - reports/flaky-evidence.json
          - action: assert
            expect:
              exit_code: 0
              body_contains: "| check | fail-once | 2 | exit status 1 |"
      - name: overlay-retries-above-max-retries-refused
        steps:
          - action: cli
            command: bin/maslow
            args:
              - verify
              - --spec
              - testdata/flaky/maslow.yaml
              - --profile
              - quick
              - --report
              - reports/flaky-overlay-evidence.json
              - --overlay
              - testdata/overlays/too-many-retries.yaml
          - action: assert
            expect:
              exit_code: 1
              body_contains: "above the spec's max_retries of 5"

  - name: audit-command
    description: Audit writes its own evidence file so it never overwrites verify's
    scenarios:
      - name: default-report-path
        steps:
          - action: cli
            command: bin/maslow
            args:
              - audit
          - action: assert
            expect:
              exit_code: 0
              body_contains: "report written to reports/audit.json"
      - name: custom-report-path
        steps:
          - action: cli
            command: bin/maslow
            args:
              - audit
              - --report
              - reports/contract-audit.json
          - action: assert
            expect:
              exit_code: 0
              body_contains: "report written to reports/contract-audit.json"

  - name: evidence-check-command
    description: Evidence check approves only evidence that matches the trusted inputs
    tags:
      - smoke
    scenarios:
      - name: matching-evidence-passes
        steps:
          - action: cli
            command: bin/maslow
            args:
              - evidence
              - check
              - testdata/evidence/pass.json
              - --head
              - "1111111111111111111111111111111111111111"
              - --spec
              - testdata/valid/minimal.yaml
              - --profile
              - quick
          - action: assert
            expect:
              exit_code: 0
              body_contains: "maslow evidence check: pass"
      - name: needs-review-verdict
        steps:
          - action: cli
            command: bin/maslow
            args:
              - evidence
              - check
              - testdata/evidence/needs-review.json
              - --head
              - "1111111111111111111111111111111111111111"
              - --spec
              - testdata/valid/minimal.yaml
          - action: assert
            expect:
              exit_code: 1
              body_contains: "maslow evidence check: needs_review"
      - name: other-head-declines
        steps:
          - action: cli
            command: bin/maslow
            args:
              - evidence
              - check
              - testdata/evidence/pass.json
              - --head
              - "2222222222222222222222222222222222222222"
              - --spec
              - testdata/valid/minimal.yaml
          - action: assert
            expect:
              exit_code: 1
              body_contains: "does not match --head"
      - name: missing-head-is-usage-error
        steps:
          - action: cli
            command: bin/maslow
            args:
              - evidence
              - check
              - testdata/evidence/pass.json
              - --spec
              - testdata/valid/minimal.yaml
          - action: assert
            expect:
              exit_code: 2
      - name: red-green-evidence-passes-require-red-green
        steps:
          - action: cli
            command: bin/maslow
            args:
              - evidence
              - check
              - testdata/evidence/red-green.json
              - --head
              - "1111111111111111111111111111111111111111"
              - --spec
              - testdata/valid/minimal.yaml
              - --overlay-sha256
              - "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
              - --base
              - "3333333333333333333333333333333333333333"
              - --require-red-green
          - action: assert
            expect:
              exit_code: 0
              body_contains: "maslow evidence check: pass"
      - name: overlay-run-without-red-green-declines
        steps:
          - action: cli
            command: bin/maslow
            args:
              - evidence
              - check
              - testdata/evidence/overlay-without-red-green.json
              - --head
              - "1111111111111111111111111111111111111111"
              - --spec
              - testdata/valid/minimal.yaml
              - --overlay-sha256
              - "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
              - --base
              - "3333333333333333333333333333333333333333"
              - --require-red-green
          - action: assert
            expect:
              exit_code: 1
              body_contains: "was verify run with --red-green?"

  - name: evidence-summary-command
    description: Evidence summary lists observed policy findings apart from enforced results
    tags:
      - smoke
    scenarios:
      - name: observed-findings-listed
        steps:
          - action: cli
            command: bin/maslow
            args:
              - evidence
              - summary
              - testdata/evidence/observe-only.json
          - action: assert
            expect:
              exit_code: 0
              body_contains: "Observed policy rules"
          - action: assert
            expect:
              body_contains: "would_fail"
      - name: missing-file-is-usage-error
        steps:
          - action: cli
            command: bin/maslow
            args:
              - evidence
              - summary
          - action: assert
            expect:
              exit_code: 2

  - name: init-command
    description: The init command manages maslow.yaml in the current directory
    scenarios:
      - name: existing-spec-detected
        steps:
          - action: cli
            command: bin/maslow
            args:
              - init
          - action: assert
            expect:
              exit_code: 0
              body_contains: "already exists"

  - name: action-pins-check
    description: Action pins are full SHAs in the published Action and for third-party actions in workflows
    scenarios:
      - name: unpinned-third-party-in-workflow-fails
        steps:
          - action: cli
            command: scripts/check-action-pins.sh
            args:
              - --workflows
              - testdata/action-pins/unpinned-workflow
          - action: assert
            expect:
              exit_code: 1
              body_contains: "browser-actions/setup-chrome@v2"
      - name: first-party-tag-in-workflow-passes
        steps:
          - action: cli
            command: scripts/check-action-pins.sh
            args:
              - --workflows
              - testdata/action-pins/pinned-workflow
          - action: assert
            expect:
              exit_code: 0
              body_contains: "all actions pinned"
      - name: first-party-tag-in-action-fails
        steps:
          - action: cli
            command: scripts/check-action-pins.sh
            args:
              - testdata/action-pins/action-tag-pinned.yml
          - action: assert
            expect:
              exit_code: 1
              body_contains: "actions/upload-artifact@v4"

  - name: trusted-workflow-check
    description: The trusted evidence workflow never gives the change's code write scope, secrets, a token on disk or a cache
    scenarios:
      - name: good-workflow-passes
        steps:
          - action: cli
            command: scripts/check-trusted-workflow.sh
            args:
              - testdata/trusted-workflow/good.yml
          - action: assert
            expect:
              exit_code: 0
              body_contains: "trusted workflow invariants hold"
      - name: pull-request-trigger-fails
        steps:
          - action: cli
            command: scripts/check-trusted-workflow.sh
            args:
              - testdata/trusted-workflow/pull-request-trigger.yml
          - action: assert
            expect:
              exit_code: 1
              body_contains: "the only trigger must be pull_request_target"
      - name: top-level-permissions-fails
        steps:
          - action: cli
            command: scripts/check-trusted-workflow.sh
            args:
              - testdata/trusted-workflow/top-level-permissions.yml
          - action: assert
            expect:
              exit_code: 1
              body_contains: "top-level permissions must be {}"
      - name: write-permission-fails
        steps:
          - action: cli
            command: scripts/check-trusted-workflow.sh
            args:
              - testdata/trusted-workflow/write-permission.yml
          - action: assert
            expect:
              exit_code: 1
              body_contains: "grants a write permission"
      - name: secrets-fail
        steps:
          - action: cli
            command: scripts/check-trusted-workflow.sh
            args:
              - testdata/trusted-workflow/secrets.yml
          - action: assert
            expect:
              exit_code: 1
              body_contains: "references secrets or github.token"
      - name: missing-fork-guard-fails
        steps:
          - action: cli
            command: scripts/check-trusted-workflow.sh
            args:
              - testdata/trusted-workflow/missing-fork-guard.yml
          - action: assert
            expect:
              exit_code: 1
              body_contains: "job record must run only when head.repo.full_name == github.repository"
      - name: head-checkout-keeping-token-fails
        steps:
          - action: cli
            command: scripts/check-trusted-workflow.sh
            args:
              - testdata/trusted-workflow/head-checkout-token.yml
          - action: assert
            expect:
              exit_code: 1
              body_contains: "job verify: actions/checkout must set persist-credentials: false"
      - name: setup-go-cache-fails
        steps:
          - action: cli
            command: scripts/check-trusted-workflow.sh
            args:
              - testdata/trusted-workflow/setup-go-cache.yml
          - action: assert
            expect:
              exit_code: 1
              body_contains: "job verify: actions/setup-go must set cache: false"
      - name: actions-cache-fails
        steps:
          - action: cli
            command: scripts/check-trusted-workflow.sh
            args:
              - testdata/trusted-workflow/actions-cache.yml
          - action: assert
            expect:
              exit_code: 1
              body_contains: "job verify: actions/cache is not allowed"
      - name: missing-file-is-usage-error
        steps:
          - action: cli
            command: scripts/check-trusted-workflow.sh
            args:
              - testdata/trusted-workflow/no-such-file.yml
          - action: assert
            expect:
              exit_code: 2

  - name: browser-steps
    description: Browser steps drive Chrome through the built binary, without a server
    scenarios:
      - name: fill-click-wait-assert
        steps:
          - action: browser
            do: navigate
            url: >-
              data:text/html,<title>steps</title><input id="name"><button id="go" onclick="document.getElementById('out').textContent='Hello, '+document.getElementById('name').value">Go</button><div id="out"></div><div id="late"></div><script>setTimeout(function(){document.getElementById('late').innerHTML='<span id=ready>ready</span>'},300)</script>
          - action: browser
            do: fill
            selector: "#name"
            text: maslow
          - action: browser
            do: click
            selector: "#go"
          - action: browser
            do: wait
            selector: "#ready"
            timeout: 5s
          - action: browser
            do: assert
            selector: "#out"
            expect:
              text_contains: "Hello, maslow"
              visible: true
        artifacts:
          - "reports/browser/**"

budgets:
  - name: binary-size
    kind: artifact_size
    target: bin/maslow
    max: 50MB
  - name: quick-verify-speed
    kind: performance
    target: "maslow verify --profile quick"
    p95: 5s
    max: 10s

audit:
  targets:
    - kind: binary
      path: bin/maslow
      timeout: 60s
      retries: 0
      checks:
        - version-check
