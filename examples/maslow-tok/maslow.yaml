# MaslowTok - adapted to maslow.cue schema
# Comments mark schema gaps; commented blocks show original intent.

mas: "1.0"

project:
  name: MaslowTok
  description: TikTok-style short video platform (monorepo) with black-box auditable constraints
  version: "0.1.0"
  # GAP: schema has no repo_layout, owners
  # repo_layout: "monorepo"
  # owners: ["team-product", "team-platform"]

packages:
  - name: api
    path: services/api
  - name: worker
    path: services/worker
  - name: web
    path: apps/web
  - name: mobile
    path: apps/mobile
  - name: shared
    path: packages/shared
# GAP: schema Package has no 'kind' (http_service, async_worker, web_app, etc.)
# Original had: kind: "http_service" | "async_worker" | "web_app" | "mobile_app" | "library"

toolchain:
  manager: asdf
  # GAP: schema lockfiles is [...string]; original had kind+uri per entry
  lockfiles:
    - .tool-versions
    - pnpm-lock.yaml
    - services/api/go.sum
  tools:
    - name: node
      version: "20"
      required: true
    - name: go
      version: "1.21"
      required: true
    - name: pnpm
      version: "8"
      required: true

refs:
  - kind: file
    path: docs/PRD.md
    description: Product requirements document — north star for all features
    required: true
  - kind: file
    path: docs/BRANDING.md
    description: Brand guidelines, colors, typography, and visual identity
    required: false
  - kind: url
    path: https://www.tiktok.com
    description: Reference app for UX patterns and feature inspiration
    required: false
  - kind: file
    path: .editorconfig
    description: EditorConfig
    required: true
  - kind: file
    path: .prettierrc
    description: Prettier config
    required: true
  - kind: file
    path: eslint.config.js
    description: ESLint config
    required: true
  - kind: file
    path: .golangci.yml
    description: golangci-lint config
    required: true
  - kind: file
    path: docs/openapi.yaml
    description: OpenAPI spec
    required: true
  - kind: mcp
    path: "@anthropic/mcp-server-github"
    name: github
    description: GitHub API for PRs, issues, and code search
    transport: stdio
    command: npx
    args: ["-y", "@anthropic/mcp-server-github"]
    env:
      GITHUB_TOKEN: ""
    required: false
  - kind: mcp
    path: "@anthropic/mcp-browser"
    name: browser
    description: Browser automation for visual regression testing
    transport: stdio
    command: npx
    args: ["-y", "@anthropic/mcp-browser"]
    required: false
# GAP: schema has no apply (scope, paths), validate (mode, command)
# Original: apply: { scope: path, paths: ["apps/**", "packages/**"] }
# Original: validate: { mode: tool, command: "pnpm -w prettier -c ." }

policy:
  allow:
    - "apps/**"
    - "packages/**"
    - "services/**"
    - "docs/**"
    - "audit/**"
    - "reports/**"
  deny:
    - "maslow.yaml"
    - ".tool-versions"
    - "pnpm-lock.yaml"
    - "services/api/go.mod"
    - "services/api/go.sum"
    - ".golangci.yml"
    - "eslint.config.js"
    - ".prettierrc"

profiles:
  quick:
    description: Fast checks
    checks:
      - refs
      - contract
      - lint
      - unit
  full:
    description: All checks
    checks:
      - refs
      - contract
      - lint
      - unit
      - perf
      - security_smoke

# GAP: schema has no 'system' (entrypoints, auth, test_controls)
